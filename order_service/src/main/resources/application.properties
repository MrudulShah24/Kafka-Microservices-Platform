spring.application.name=order_service

server.port=8080

# KAFKA CONFIG
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# POSTGRESQL CONFIG
spring.datasource.url=jdbc:postgresql://postgres:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# DASHBOARD EVENTS CONSUMER

spring.kafka.consumer.group-id=dashboard-group

spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.value.default.type=com.mrudul.order_service.dto.EventMessage

spring.kafka.consumer.properties.spring.json.use.type.headers=false